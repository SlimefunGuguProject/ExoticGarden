name: Bug汇报
description: 反馈本插件的Bug或问题
labels: ["bug"]
assignees:
  - ybw0014
body:
  - type: markdown
    attributes:
      value: |
        ## 欢迎来到 SlimefunGuguProject 的问题追踪器
        你正在反馈 ExoticGarden（异域花园）汉化版出现的 Bug。
        任何意见，建议请前往[QQ群](https://50l.cc/sf-qg)进行反馈。
        建议先阅读[这篇文章](https://slimefun-wiki.guizhanss.cn/How-to-report-bugs)了解如何正确地汇报Bug。

        <strong><i>你必须填写标注为星号（*）的表单项</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项目
      description: 在汇报之前，你需要确认
      options:
        - label: 你使用的是从资源站下载的版本 (https://resources.guizhanss.com)
          required: true
        - label: 你已经检验过下载的文件的校验和，确认已完整下载文件
          required: true
        - label: 你没有对下载的文件内容进行任何更改
          required: true
        - label: 你已经寻找过[已知问题列表](https://github.com/SlimefunGuguProject/ExoticGarden/issues)，且没有找到相同的问题
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: |
        详细描述你要汇报的问题
        提供详细的信息能让我们更快地处理问题
      placeholder: 只说"不能用"没法让开发者定位问题。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: |
        请详细描述如何才能复现该问题
        如果有视频，请在此提供视频链接
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: |
        你觉得应该发生什么
        有时候，问题的原因是你误解了某个功能。
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: 服务器日志
      description: |
        请查看服务器日志中是否包含任何报错，如果有请上传至 [https://mclo.gs](https://mclo.gs) 并在此填入链接。
        **不要直接在这里粘贴日志**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: 错误报告
      description: |
        如果服务器日志中提到了`/plugins/Slimefun/error-reports`中的文件（即错误报告）
        请上传至 [https://mclo.gs](https://mclo.gs) 并在此填入链接。
        **不要直接在这里粘贴错误报告**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: |
        请在游戏内运行 `/sf versions`，并把指令的**完整输出**截图或粘贴到此处。
        如果该命令无法运行，请手动提供服务端软件、服务端Minecraft版本、Slimefun版本、本插件版本与插件列表。
        如果服务端的Minecraft版本与连接服务器所用客户端的Minecraft版本不一致，请一并说明。
      placeholder: |
        （在这里粘贴 /sf versions 的完整输出，或手动填写）
    validations:
      required: true
